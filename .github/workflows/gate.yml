name: Gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix docs-site
      - run: npm ci --prefix examples/product
      - run: npm run build:tokens
      - run: npm run build:catalog
      - run: npm run build:docs
      - run: npm run build --prefix docs-site
      - run: npm run build --prefix examples/product
      - run: npm run check
      - run: npx atomic audit
      - run: npx atomic sync
      - run: npx atomic decisions
      - run: npm test
